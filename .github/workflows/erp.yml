name: Recette ERP
on:
  push:
    branches: [transitflow-erp, transitflow-tests, pwa-mobile, messaging-realtime, personnel-actions]
  pull_request:
    branches: [erp, main, transitflow-erp]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: transitflow
          POSTGRES_USER: transitflow
          POSTGRES_PASSWORD: recette-local-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U transitflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://transitflow:recette-local-only@127.0.0.1:5432/transitflow
      TF_SECRET_KEY: secret-uniquement-pour-la-recette-automatique
      TF_DEBUG: '1'
      TF_LEGACY_ENABLED: '0'
      TF_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: frontend
      - run: python backend/manage.py collectstatic --noinput
      - run: python -m pytest apps/erp/tests -q
        working-directory: backend
      - run: python backend/manage.py migrate --noinput
      - run: pnpm exec playwright install --with-deps chromium webkit
        working-directory: frontend
      - name: Serveur de recette
        run: |
          python -m uvicorn transitflow.asgi:application --app-dir backend --host 127.0.0.1 --port 8000 --workers 2 > /tmp/transitflow-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail http://127.0.0.1:8000/api/sante && exit 0
            sleep 1
          done
          cat /tmp/transitflow-server.log
          exit 1
      - run: pnpm exec playwright test erp.spec.ts
        working-directory: frontend
      - name: Isoler les compteurs de la recette invitations
        run: python backend/manage.py shell -c "from apps.erp.models import AuthLimit; AuthLimit.objects.all().delete()"
      - name: Recette invitations dans le navigateur
        run: pnpm exec playwright test invitation.spec.ts --output=test-results-invitation
        working-directory: frontend
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-invitation
      - name: Isoler les compteurs de la recette multi-appareils
        run: python backend/manage.py shell -c "from apps.erp.models import AuthLimit; AuthLimit.objects.all().delete()"
      - name: Recette PWA et responsive multi-appareils
        run: pnpm exec playwright test responsive.spec.ts pwa-update.spec.ts --output=test-results-responsive
        working-directory: frontend
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-responsive
      - name: Messagerie entre deux utilisateurs sur cinq appareils
        run: |
          for project in chromium android iphone ipad small; do
            python backend/manage.py shell -c "from apps.erp.models import AuthLimit; AuthLimit.objects.all().delete()"
            PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report-messaging-$project pnpm --dir frontend exec playwright test messaging.spec.ts --project=$project --output=test-results-messaging-$project || exit 1
          done
      - name: Personnel contact et retrait sur cinq appareils
        run: |
          for project in chromium android iphone ipad small; do
            python backend/manage.py shell -c "from apps.erp.models import AuthLimit; AuthLimit.objects.all().delete()"
            PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report-personnel-$project pnpm --dir frontend exec playwright test personnel.spec.ts --project=$project --output=test-results-personnel-$project || exit 1
          done
      - name: Audit Lighthouse mobile
        working-directory: frontend
        run: |
          export CHROME_PATH=$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")
          pnpm --config.enable-global-virtual-store=false dlx lighthouse@13.5.0 http://127.0.0.1:8000/connexion --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices --output=json --output=html --output-path=lighthouse-mobile --quiet
      - name: Construction de l’image de production
        run: docker build --tag transitflow-recette .
      - name: Stockage persistant et abandon des privileges
        run: |
          docker volume create transitflow-private-recette
          docker run --rm -v transitflow-private-recette:/data transitflow-recette python -c "import os,pathlib; assert os.geteuid()==10001; assert os.getegid()!=0; assert os.getgroups()==[]; pathlib.Path('/data/privatefiles/persistence.txt').write_text('recette')"
          docker run --rm -v transitflow-private-recette:/data transitflow-recette python -c "import os,pathlib; assert os.geteuid()==10001; assert pathlib.Path('/data/privatefiles/persistence.txt').read_text()=='recette'; assert pathlib.Path('/data/privatefiles').stat().st_mode & 0o777 == 0o700"
          docker run --rm --user 10001 -v transitflow-private-recette:/data transitflow-recette python -c "import os; assert os.geteuid()==10001"
          if docker run --rm -e TF_PRIVATE_STORAGE=/app transitflow-recette true; then
            echo "Une destination non autorisee ne doit pas etre initialisee."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recette-navigateur
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/playwright-report-invitation
            frontend/test-results-invitation
            frontend/playwright-report-responsive
            frontend/test-results-responsive
            frontend/playwright-report-messaging-*
            frontend/test-results-messaging-*
            frontend/playwright-report-personnel-*
            frontend/test-results-personnel-*
            frontend/lighthouse-mobile.report.json
            frontend/lighthouse-mobile.report.html
