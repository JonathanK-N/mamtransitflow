<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Mamadou Barry">
<title>Connexion · TransitFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/transitflow.css" rel="stylesheet">
</head>
<body>
<main class="tf-login">
  <aside class="tf-login-aside">
    <span class="tf-brand" style="margin:0">Transit<span>Flow</span></span>
    <div class="d-flex flex-column gap-4">
      <h1 class="tf-login-title">Votre flotte,<br>suivie en direct.</h1>
      <p class="tf-login-sub mb-0">Chauffeurs, trajets, arrets et incidents dans une seule interface,
        du depart a l arrivee.</p>
    </div>
    <div class="tf-placeholder" style="height:150px;background:repeating-linear-gradient(45deg,#332D28 0 7px,#3A332D 7px 14px);color:var(--tf-on-dark-muted)">
      <img src="img.png" alt="">
    </div>
  </aside>

  <section class="tf-login-main">
    <form class="tf-login-form" data-connexion novalidate>
      <div>
        <h2 class="tf-h1">Connexion</h2>
        <p class="tf-meta mt-1 mb-0">Accedez a votre espace</p>
      </div>

      <div class="tf-segment" role="tablist">
        <button type="button" class="active" data-role="admin">Administrateur</button>
        <button type="button" data-role="chauffeur">Chauffeur</button>
      </div>

      <label class="tf-field">
        <span class="tf-label">Courriel</span>
        <input class="tf-input" type="email" name="courriel" autocomplete="username"
               value="" required>
      </label>

      <label class="tf-field">
        <span class="tf-label">Mot de passe</span>
        <input class="tf-input" type="password" name="motDePasse" autocomplete="current-password"
               value="" required>
      </label>

      <div class="d-flex align-items-center justify-content-between" style="font-size:13.5px">
        <label class="d-flex align-items-center gap-2 tf-muted mb-0">
          <input type="checkbox" name="memoriser"> Se souvenir de moi
        </label>
        <a href="#">Mot de passe oublie ?</a>
      </div>

      <p class="tf-pill danger tf-hidden mb-0" data-erreur style="justify-content:center"></p>

      <button class="tf-btn tf-btn-primary tf-btn-block" type="submit" style="height:50px">Se connecter</button>

    </form>
  </section>
</main>

<script src="assets/js/store.js"></script>
<script src="assets/js/format.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/store.js"></script>
<script>
(function () {
  var role = 'admin';
  var formulaire = document.querySelector('[data-connexion]');
  var erreur = document.querySelector('[data-erreur]');
  var champCourriel = formulaire.querySelector('[name=courriel]');

  document.querySelectorAll('[data-role]').forEach(function (bouton) {
    bouton.addEventListener('click', function () {
      document.querySelectorAll('[data-role]').forEach(function (b) { b.classList.remove('active'); });
      bouton.classList.add('active');
      role = bouton.dataset.role;
    });
  });

  formulaire.addEventListener('submit', function (e) {
    e.preventDefault();
    var donnees = new FormData(formulaire);
    var resultat = Auth.connecter(donnees.get('courriel'), donnees.get('motDePasse'), role);
    if (!resultat.ok) {
      erreur.textContent = resultat.message;
      erreur.classList.remove('tf-hidden');
      return;
    }
    window.location.href = Auth.accueil(resultat.session);
  });
})();
</script>
</body>
</html>
