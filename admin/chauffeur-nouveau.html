<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Mamadou Barry">
<title>Nouveau chauffeur · TransitFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/transitflow.css" rel="stylesheet">
</head>
<body data-page="chauffeur-nouveau">
<nav class="tf-navbar">
  <a class="tf-brand" href="tableau-de-bord.html">Transit<span>Flow</span></a>
  <a class="tf-nav-link" href="tableau-de-bord.html">Tableau de bord</a>
  <a class="tf-nav-link active" href="chauffeurs.html">Chauffeurs</a>
  <a class="tf-nav-link" href="trajets.html">Trajets</a>
  <a class="tf-nav-link" href="incidents.html">Incidents</a>
  <div class="tf-navbar-user" data-navbar-user></div>
</nav>
<main class="tf-page">
  <p class="tf-meta mb-0"><a href="chauffeurs.html">Chauffeurs</a>
    <span class="tf-muted">/</span> Nouveau</p>
  <h1 class="tf-h1">Nouveau compte chauffeur</h1>

  <form class="tf-card tf-card-pad d-flex flex-column gap-4" data-formulaire>
    <fieldset class="border-0 p-0 m-0">
      <legend class="tf-mono" style="font-size:10.5px;letter-spacing:.04em;color:var(--tf-muted)">IDENTITE</legend>
      <div class="row g-3 mt-1">
        <div class="col-12 col-md-4"><label class="tf-field">
          <span class="tf-label">Prenom</span><input class="tf-input" name="prenom" required></label></div>
        <div class="col-12 col-md-4"><label class="tf-field">
          <span class="tf-label">Nom</span><input class="tf-input" name="nom" required></label></div>
        <div class="col-12 col-md-4"><label class="tf-field">
          <span class="tf-label">Age</span>
          <input class="tf-input" name="age" type="number" min="18" max="75" required></label></div>
      </div>
    </fieldset>

    <fieldset class="border-0 p-0 m-0">
      <legend class="tf-mono" style="font-size:10.5px;letter-spacing:.04em;color:var(--tf-muted)">CONTACT</legend>
      <div class="row g-3 mt-1">
        <div class="col-12 col-md-4"><label class="tf-field">
          <span class="tf-label">Telephone</span>
          <input class="tf-input" name="telephone" type="tel" placeholder="514 555-0000" required></label></div>
        <div class="col-12 col-md-4"><label class="tf-field">
          <span class="tf-label">Courriel</span>
          <input class="tf-input" name="courriel" type="email" required></label></div>
        <div class="col-12 col-md-4"><label class="tf-field">
          <span class="tf-label">Adresse du domicile</span>
          <input class="tf-input" name="adresse" required></label></div>
      </div>
    </fieldset>

    <fieldset class="border-0 p-0 m-0">
      <legend class="tf-mono" style="font-size:10.5px;letter-spacing:.04em;color:var(--tf-muted)">PERMIS ET AFFECTATION</legend>
      <div class="row g-3 mt-1">
        <div class="col-12 col-md-3"><label class="tf-field">
          <span class="tf-label">Numero de permis</span>
          <input class="tf-input" name="permisNumero" required></label></div>
        <div class="col-12 col-md-3"><label class="tf-field">
          <span class="tf-label">Expiration du permis</span>
          <input class="tf-input" name="permisExpiration" type="date" required></label></div>
        <div class="col-12 col-md-3"><label class="tf-field">
          <span class="tf-label">Statut initial</span>
          <select class="tf-input" name="statut">
            <option value="disponible">Disponible</option>
            <option value="hors-service">Hors service</option>
          </select></label></div>
        <div class="col-12 col-md-3"><label class="tf-field">
          <span class="tf-label">Vehicule habituel</span>
          <select class="tf-input" name="plaque">
            <option value="QC-4821">QC-4821</option>
            <option value="QC-1094">QC-1094</option>
            <option value="QC-7733">QC-7733</option>
            <option value="QC-2287">QC-2287</option>
            <option value="QC-5512">QC-5512</option>
          </select></label></div>
      </div>
    </fieldset>

    <div class="d-flex justify-content-end gap-3 pt-4" style="border-top:1px solid var(--tf-line)">
      <a class="tf-btn tf-btn-ghost" href="chauffeurs.html">Annuler</a>
      <button class="tf-btn tf-btn-primary" type="submit">Creer le compte</button>
    </div>
  </form>
</main>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/format.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
