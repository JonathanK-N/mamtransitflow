<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Jonathan K-N">
<title>Fiche vehicule · TransitFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/transitflow.css" rel="stylesheet">
</head>
<body data-page="vehicule">
<nav class="tf-navbar">
  <a class="tf-brand" href="#">Transit<span>Flow</span></a>
  <div class="tf-navbar-user" data-navbar-user></div>
</nav>
<main class="tf-page" data-contenu>
  <p class="tf-meta mb-0"><a href="vehicules.html">Vehicules</a>
    <span class="tf-muted">/</span> <span class="tf-mono" data-fil></span></p>

  <section class="tf-card tf-card-pad d-flex flex-wrap align-items-center gap-4">
    <div class="d-flex flex-column gap-2">
      <div class="d-flex align-items-center gap-3 flex-wrap">
        <h1 class="tf-h1 tf-mono" data-plaque></h1>
        <span class="tf-pill" data-statut></span>
      </div>
      <span class="tf-meta" data-modele></span>
    </div>
    <div class="ms-auto d-flex align-items-center gap-4 flex-wrap">
      <div class="text-end">
        <div class="tf-mono" style="font-size:24px;font-weight:500" data-compteur></div>
        <div class="tf-meta">compteur actuel</div>
      </div>
      <button type="button" class="tf-btn tf-btn-ghost" data-relever>Relever le compteur</button>
    </div>
  </section>

  <div class="d-flex gap-2 flex-wrap">
    <a class="tf-btn tf-btn-primary sm" data-nouveau-bon href="entretiens.html">+ Bon de travail</a>
    <button type="button" class="tf-btn tf-btn-ghost sm" data-modifier>Modifier la fiche</button>
    <button type="button" class="tf-btn tf-btn-ghost sm" data-basculer-service></button>
  </div>

  <div class="row g-3 align-items-start">
    <div class="col-12 col-lg-4 d-flex flex-column gap-3">
      <section class="tf-card tf-card-pad d-flex flex-column gap-4">
        <h2 class="tf-h3">Informations</h2>
        <div class="tf-props" data-informations></div>
        <div class="pt-3" style="border-top:1px solid var(--tf-line)">
          <div class="tf-meta mb-2">Chauffeurs habituels</div>
          <div class="d-flex flex-column gap-2" data-chauffeurs></div>
        </div>
      </section>
      <section class="tf-card tf-card-pad d-flex flex-column gap-3">
        <h2 class="tf-h3">Releves du compteur</h2>
        <div class="d-flex flex-column gap-2" data-releves></div>
      </section>
    </div>

    <div class="col-12 col-lg-8">
      <section class="tf-card">
        <nav class="tf-tabs">
          <button type="button" class="tf-tab active" data-onglet="plans">Entretien preventif
            <span class="tf-mono" data-nb-plans></span></button>
          <button type="button" class="tf-tab" data-onglet="bons">Bons de travail
            <span class="tf-mono" data-nb-bons></span></button>
        </nav>
        <div data-volet="plans">
          <div class="d-flex align-items-center gap-3 px-4 pt-3 flex-wrap">
            <span class="tf-meta" data-resume-plans></span>
            <button type="button" class="tf-btn tf-btn-ghost sm ms-auto" data-ajouter-plan>+ Ajouter un plan</button>
          </div>
          <div class="tf-table-scroll mt-2">
            <table class="tf-table">
              <thead><tr><th>ENTRETIEN</th><th>DERNIER</th><th>PROCHAIN</th><th>ECHEANCE</th><th></th></tr></thead>
              <tbody data-plans></tbody>
            </table>
          </div>
        </div>
        <div class="tf-hidden" data-volet="bons">
          <div class="tf-table-scroll">
            <table class="tf-table">
              <thead><tr><th>BON</th><th>DATE</th><th>INTERVENTION</th><th>STATUT</th><th class="text-end">COUT</th></tr></thead>
              <tbody data-bons></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </div>
</main>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/format.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/admin.js"></script>
<script src="../assets/js/admin-flotte.js"></script>
</body>
</html>
