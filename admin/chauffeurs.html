<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Mamadou Barry">
<title>Chauffeurs · TransitFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/transitflow.css" rel="stylesheet">
</head>
<body data-page="chauffeurs">
<nav class="tf-navbar">
  <a class="tf-brand" href="tableau-de-bord.html">Transit<span>Flow</span></a>
  <a class="tf-nav-link" href="tableau-de-bord.html">Tableau de bord</a>
  <a class="tf-nav-link active" href="chauffeurs.html">Chauffeurs</a>
  <a class="tf-nav-link" href="trajets.html">Trajets</a>
  <a class="tf-nav-link" href="incidents.html">Incidents</a>
  <a class="tf-nav-link" href="vehicules.html">Vehicules</a>
  <div class="tf-navbar-user" data-navbar-user></div>
</nav>
<main class="tf-page">
  <div class="d-flex align-items-end justify-content-between flex-wrap gap-3">
    <div>
      <h1 class="tf-h1">Chauffeurs</h1>
      <p class="tf-meta mt-1 mb-0" data-compteur></p>
    </div>
    <a class="tf-btn tf-btn-primary" href="chauffeur-nouveau.html">+ Nouveau chauffeur</a>
  </div>

  <div class="d-flex flex-wrap gap-3 align-items-center">
    <input class="tf-input" style="flex:1 1 280px" type="search" data-recherche
           placeholder="Rechercher un nom, un telephone, un courriel...">
    <div class="d-flex gap-2 flex-wrap">
      <button class="tf-chip active" type="button" data-filtre-statut="tous">Tous</button>
      <button class="tf-chip" type="button" data-filtre-statut="en-trajet">En trajet</button>
      <button class="tf-chip" type="button" data-filtre-statut="disponible">Disponibles</button>
      <button class="tf-chip" type="button" data-filtre-statut="hors-service">Hors service</button>
    </div>
  </div>

  <section class="tf-card tf-table-wrap">
    <table class="tf-table">
      <thead><tr>
        <th>NOM</th><th>TELEPHONE</th><th>COURRIEL</th><th>PERMIS EXPIRE</th><th>STATUT</th><th></th>
      </tr></thead>
      <tbody data-liste-chauffeurs></tbody>
    </table>
  </section>
</main>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/format.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
