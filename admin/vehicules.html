<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Jonathan K-N">
<title>Vehicules · TransitFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/transitflow.css" rel="stylesheet">
</head>
<body data-page="vehicules">
<nav class="tf-navbar">
  <a class="tf-brand" href="tableau-de-bord.html">Transit<span>Flow</span></a>
  <a class="tf-nav-link" href="tableau-de-bord.html">Tableau de bord</a>
  <a class="tf-nav-link" href="chauffeurs.html">Chauffeurs</a>
  <a class="tf-nav-link" href="trajets.html">Trajets</a>
  <a class="tf-nav-link" href="incidents.html">Incidents</a>
  <a class="tf-nav-link active" href="vehicules.html">Vehicules</a>
  <div class="tf-navbar-user" data-navbar-user></div>
</nav>
<main class="tf-page">
  <div>
    <h1 class="tf-h1">Vehicules</h1>
    <p class="tf-meta mt-1 mb-0" data-compteur></p>
  </div>

  <form class="tf-card tf-card-pad" data-formulaire>
    <div class="row g-3 align-items-end">
      <div class="col-12 col-md-4"><label class="tf-field">
        <span class="tf-label">Plaque</span>
        <input class="tf-input tf-mono" name="plaque" maxlength="20" placeholder="QC-0000" required></label></div>
      <div class="col-12 col-md-5"><label class="tf-field">
        <span class="tf-label">Modele</span>
        <input class="tf-input" name="modele" maxlength="100" placeholder="Ford Transit 2024" required></label></div>
      <div class="col-12 col-md-3">
        <button class="tf-btn tf-btn-primary tf-btn-block" type="submit">+ Ajouter</button></div>
    </div>
  </form>

  <section class="tf-card tf-table-wrap">
    <table class="tf-table">
      <thead><tr><th>PLAQUE</th><th>MODELE</th><th>CHAUFFEURS HABITUELS</th></tr></thead>
      <tbody data-liste-vehicules></tbody>
    </table>
  </section>
</main>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/format.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
