<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Jonathan K-N">
<title>Vehicules · TransitFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/transitflow.css" rel="stylesheet">
</head>
<body data-page="vehicules">
<nav class="tf-navbar">
  <a class="tf-brand" href="#">Transit<span>Flow</span></a>
  <div class="tf-navbar-user" data-navbar-user></div>
</nav>
<main class="tf-page">
  <div class="d-flex align-items-end justify-content-between flex-wrap gap-3">
    <div>
      <h1 class="tf-h1">Vehicules</h1>
      <p class="tf-meta mt-1 mb-0" data-compteur></p>
    </div>
    <div class="d-flex gap-2 flex-wrap">
      <button type="button" class="tf-chip active" data-filtre-vehicule="tous">Tous</button>
      <button type="button" class="tf-chip" data-filtre-vehicule="actif">Actifs</button>
      <button type="button" class="tf-chip" data-filtre-vehicule="maintenance">En maintenance</button>
      <button type="button" class="tf-chip" data-filtre-vehicule="hors-service">Hors service</button>
    </div>
  </div>

  <form method="post" class="tf-card tf-card-pad" data-formulaire>
    <div class="row g-3 align-items-end">
      <div class="col-12 col-sm-6 col-lg-2"><label class="tf-field">
        <span class="tf-label">Plaque</span>
        <input class="tf-input tf-mono" name="plaque" maxlength="20" placeholder="QC-0000" required></label></div>
      <div class="col-12 col-sm-6 col-lg-4"><label class="tf-field">
        <span class="tf-label">Modele</span>
        <input class="tf-input" name="modele" maxlength="100" placeholder="Ford Transit" required></label></div>
      <div class="col-6 col-lg-2"><label class="tf-field">
        <span class="tf-label">Annee</span>
        <input class="tf-input tf-mono" name="annee" type="number" min="1980" placeholder="2024"></label></div>
      <div class="col-6 col-lg-2"><label class="tf-field">
        <span class="tf-label">Compteur (km)</span>
        <input class="tf-input tf-mono" name="kilometrage" type="number" min="0" step="1" placeholder="0"></label></div>
      <div class="col-12 col-lg-2">
        <button class="tf-btn tf-btn-primary tf-btn-block" type="submit">+ Ajouter</button></div>
    </div>
  </form>

  <section class="tf-card tf-table-scroll">
    <table class="tf-table">
      <thead><tr><th>PLAQUE</th><th>MODELE</th><th>COMPTEUR</th><th>STATUT</th><th>ENTRETIEN</th>
        <th>CHAUFFEURS HABITUELS</th><th></th></tr></thead>
      <tbody data-liste-vehicules></tbody>
    </table>
  </section>
</main>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/format.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/admin.js"></script>
<script src="../assets/js/admin-flotte.js"></script>
</body>
</html>
