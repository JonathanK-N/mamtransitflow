<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Jonathan K-N">
<title>Mon profil · TransitFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/transitflow.css" rel="stylesheet">
</head>
<body data-page="profil">
<nav class="tf-navbar">
  <a class="tf-brand" href="#">Transit<span>Flow</span></a>
  <div class="tf-navbar-user" data-navbar-user></div>
</nav>
<main class="tf-page">
  <div><h1 class="tf-h1">Mon profil</h1><p class="tf-meta mt-1 mb-0" data-entreprise></p></div>
  <div class="row g-3 align-items-start">
    <div class="col-12 col-lg-6">
      <form class="tf-card tf-card-pad d-flex flex-column gap-3" data-form-profil novalidate>
        <h2 class="tf-h3">Mes coordonnees</h2>
        <div class="row g-3">
          <div class="col-6"><div class="tf-meta mb-1">Nom</div><div data-nom style="font-size:14.5px"></div></div>
          <div class="col-6"><div class="tf-meta mb-1">Courriel de connexion</div><div data-courriel style="font-size:14.5px;overflow-wrap:anywhere"></div></div>
          <div class="col-6"><div class="tf-meta mb-1">Permis</div><div class="tf-mono" data-permis style="font-size:14px"></div></div>
          <div class="col-6"><div class="tf-meta mb-1">Expire le</div><div data-permis-expiration style="font-size:14.5px"></div></div>
        </div>
        <label class="tf-field"><span class="tf-label">Telephone</span>
          <input class="tf-input" name="telephone" type="tel" required maxlength="30"></label>
        <label class="tf-field"><span class="tf-label">Adresse du domicile</span>
          <input class="tf-input" name="adresse" required maxlength="255"></label>
        <p class="tf-meta mb-0 tf-hidden" data-profil-verrouille>Pour modifier ces informations, adressez-vous a votre
          administrateur.</p>
        <div class="d-flex justify-content-end"><button class="tf-btn tf-btn-primary" type="submit">Enregistrer</button></div>
      </form>
    </div>
    <div class="col-12 col-lg-6">
      <form class="tf-card tf-card-pad d-flex flex-column gap-3" data-form-mdp novalidate>
        <h2 class="tf-h3">Changer mon mot de passe</h2>
        <label class="tf-field"><span class="tf-label">Mot de passe actuel</span>
          <input class="tf-input" name="actuel" type="password" autocomplete="current-password" required></label>
        <label class="tf-field"><span class="tf-label">Nouveau mot de passe</span>
          <input class="tf-input" name="nouveau" type="password" autocomplete="new-password" minlength="8" required></label>
        <label class="tf-field"><span class="tf-label">Confirmez le nouveau mot de passe</span>
          <input class="tf-input" name="confirmation" type="password" autocomplete="new-password" minlength="8" required></label>
        <div class="d-flex justify-content-end"><button class="tf-btn tf-btn-primary" type="submit">Changer le mot de passe</button></div>
      </form>
    </div>
  </div>
</main>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/format.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/paie.js"></script>
<script src="../assets/js/chauffeur.js"></script>
<script src="../assets/js/chauffeur-portail.js"></script>
</body>
</html>
