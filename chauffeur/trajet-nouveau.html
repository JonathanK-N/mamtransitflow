<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Mamadou Barry">
<title>Nouveau trajet · TransitFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/transitflow.css" rel="stylesheet">
</head>
<body data-page="trajet-nouveau">
<nav class="tf-navbar">
  <a class="tf-brand" href="#">Transit<span>Flow</span></a>
  <div class="tf-navbar-user" data-navbar-user></div>
</nav>
<main class="tf-page">
  <h1 class="tf-h1">Nouveau trajet</h1>

  <div class="tf-alert high tf-hidden" data-avertissement>
    <div class="tf-alert-bar"></div>
    <div>
      <div style="font-size:13.5px;font-weight:500">Un trajet est deja en cours</div>
      <div class="tf-meta mt-1">Terminez-le avant d en demarrer un nouveau, sinon les deux
        resteront ouverts.</div>
    </div>
  </div>

  <form method="post" class="tf-card tf-card-pad d-flex flex-column gap-4" data-formulaire>
    <div>
      <h2 class="tf-h3 mb-3">Quel vehicule prenez-vous ?</h2>
      <div class="row g-3" data-vehicules></div>
    </div>

    <div class="pt-4" style="border-top:1px solid var(--tf-line)">
      <h2 class="tf-h3 mb-3">Itineraire</h2>
      <div class="row g-3">
        <div class="col-12 col-md-4"><label class="tf-field">
          <span class="tf-label">Point de depart</span>
          <input class="tf-input" name="depart" placeholder="Quebec" required></label></div>
        <div class="col-12 col-md-8"><label class="tf-field">
          <span class="tf-label">Adresse de depart</span>
          <input class="tf-input" name="departAdresse" placeholder="1290 rue Saint-Jean" required></label></div>
        <div class="col-12 col-md-4"><label class="tf-field">
          <span class="tf-label">Point d arrivee</span>
          <input class="tf-input" name="arrivee" placeholder="Trois-Rivieres" required></label></div>
        <div class="col-6 col-md-4"><label class="tf-field">
          <span class="tf-label">Heure de depart</span>
          <input class="tf-input" name="heure" type="time" required></label></div>
        <div class="col-6 col-md-4"><label class="tf-field">
          <span class="tf-label">Arrivee prevue</span>
          <input class="tf-input" name="heurePrevue" type="time" required></label></div>
      </div>
    </div>

    <div class="d-flex justify-content-end gap-3 pt-4" style="border-top:1px solid var(--tf-line)">
      <a class="tf-btn tf-btn-ghost" href="mes-trajets.html">Annuler</a>
      <button class="tf-btn tf-btn-primary" type="submit">Demarrer le trajet</button>
    </div>
    <p class="tf-meta text-center mb-0">Les arrets s ajoutent en cours de route.</p>
  </form>
</main>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/format.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/chauffeur.js"></script>
</body>
</html>
