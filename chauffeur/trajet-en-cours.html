<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Mamadou Barry">
<title>Trajet en cours · TransitFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/transitflow.css" rel="stylesheet">
</head>
<body data-page="trajet-en-cours">
<nav class="tf-navbar">
  <a class="tf-brand" href="#">Transit<span>Flow</span></a>
  <div class="tf-navbar-user" data-navbar-user></div>
</nav>
<main class="tf-page" data-contenu>
  <div class="d-flex align-items-center gap-3 flex-wrap">
    <h1 class="tf-h1" data-titre></h1>
    <span class="tf-pill warn live">En cours</span>
    <span class="tf-mono tf-meta ms-auto" data-meta></span>
  </div>

  <div class="row g-3 align-items-start">
    <div class="col-12 col-lg-7">
      <section class="tf-card tf-card-pad">
        <h2 class="tf-h3 mb-4">Deroulement</h2>
        <div class="tf-timeline" data-deroulement></div>
      </section>
    </div>

    <div class="col-12 col-lg-5 d-flex flex-column gap-3">
      <form method="post" class="tf-card tf-card-pad d-flex flex-column gap-3" data-arret>
        <h2 class="tf-h3">Ajouter un arret</h2>
        <label class="tf-field">
          <span class="tf-label">Lieu de l arret</span>
          <input class="tf-input" name="lieu" placeholder="Donnacona" required></label>
        <label class="tf-field">
          <span class="tf-label">Heure</span>
          <input class="tf-input" name="heure" type="time" required></label>
        <label class="tf-field">
          <span class="tf-label">Note (facultatif)</span>
          <input class="tf-input" name="note" placeholder="Pause de 15 minutes"></label>
        <button class="tf-btn tf-btn-primary" type="submit">Enregistrer l arret</button>
      </form>

      <section class="tf-card tf-card-pad d-flex flex-column gap-2" data-gps>
        <div class="d-flex align-items-center gap-2">
          <h2 class="tf-h3">Position GPS</h2>
          <span class="tf-pill ms-auto" data-gps-statut>—</span>
        </div>
        <p class="tf-meta mb-0" data-gps-detail></p>
        <button type="button" class="tf-btn tf-btn-ghost sm tf-hidden" data-gps-relancer>Activer la localisation</button>
        <p class="tf-meta mb-0" style="font-size:12px">Gardez cette page ouverte pendant le trajet : votre position
          est partagee avec le repartiteur uniquement tant que le trajet est en cours.</p>
      </section>

      <section class="tf-card tf-card-pad d-flex flex-column gap-3">
        <a class="tf-btn tf-btn-ghost" data-lien-incident href="incident-nouveau.html">
          Signaler un incident</a>
        <button class="tf-btn tf-btn-dark" type="button" data-terminer>Marquer l arrivee</button>
      </section>
    </div>
  </div>
</main>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/format.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/gps.js"></script>
<script src="../assets/js/chauffeur.js"></script>
</body>
</html>
