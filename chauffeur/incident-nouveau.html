<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Mamadou Barry">
<title>Signaler un incident · TransitFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/transitflow.css" rel="stylesheet">
</head>
<body data-page="incident-nouveau">
<nav class="tf-navbar">
  <a class="tf-brand" href="mes-trajets.html">Transit<span>Flow</span></a>
  <a class="tf-nav-link" href="mes-trajets.html">Mes trajets</a>
  <a class="tf-nav-link" href="trajet-nouveau.html">Nouveau trajet</a>
  <a class="tf-nav-link active" href="incident-nouveau.html">Signaler un incident</a>
  <div class="tf-navbar-user" data-navbar-user></div>
</nav>
<main class="tf-page">
  <div>
    <h1 class="tf-h1">Que s est-il passe ?</h1>
    <p class="tf-meta mt-1 mb-0" data-rattachement></p>
  </div>

  <form class="tf-card tf-card-pad d-flex flex-column gap-4" data-formulaire>
    <div class="row g-3">
      <div class="col-12 col-md-6">
        <button type="button" class="tf-tile active" data-type="technique">
          <span class="tf-tile-mark"></span>
          <span class="tf-tile-title">Probleme technique</span>
          <span class="tf-tile-note">Panne, pneu, moteur...</span>
        </button>
      </div>
      <div class="col-12 col-md-6">
        <button type="button" class="tf-tile" data-type="route">
          <span class="tf-tile-mark"></span>
          <span class="tf-tile-title">Incident de route</span>
          <span class="tf-tile-note">Accident, blocage, meteo</span>
        </button>
      </div>
    </div>

    <div class="pt-4 d-flex flex-column gap-3" style="border-top:1px solid var(--tf-line)">
      <label class="tf-field">
        <span class="tf-label">Objet</span>
        <input class="tf-input" name="titre" placeholder="Pneu avant droit creve" required></label>
      <label class="tf-field">
        <span class="tf-label">Description</span>
        <textarea class="tf-input" name="description" rows="3"
          placeholder="Decrivez le probleme..." required></textarea></label>
      <div class="row g-3">
        <div class="col-12 col-md-8"><label class="tf-field">
          <span class="tf-label">Lieu</span>
          <input class="tf-input" name="lieu" placeholder="Autoroute 40, km 61" required></label></div>
        <div class="col-12 col-md-4"><label class="tf-field">
          <span class="tf-label">Heure du constat</span>
          <input class="tf-input" name="heure" type="time" required></label></div>
      </div>
      <div class="tf-placeholder" style="height:64px">photo du constat — phase 2</div>
    </div>

    <div class="d-flex justify-content-end gap-3 pt-4" style="border-top:1px solid var(--tf-line)">
      <a class="tf-btn tf-btn-ghost" href="mes-trajets.html">Annuler</a>
      <button class="tf-btn tf-btn-primary" type="submit">Envoyer le signalement</button>
    </div>
  </form>
</main>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/format.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/chauffeur.js"></script>
</body>
</html>
