<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Mamadou Barry">
<title>Mes trajets · TransitFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/transitflow.css" rel="stylesheet">
</head>
<body data-page="mes-trajets">
<nav class="tf-navbar">
  <a class="tf-brand" href="mes-trajets.html">Transit<span>Flow</span></a>
  <a class="tf-nav-link active" href="mes-trajets.html">Mes trajets</a>
  <a class="tf-nav-link" href="trajet-nouveau.html">Nouveau trajet</a>
  <a class="tf-nav-link" href="incident-nouveau.html">Signaler un incident</a>
  <div class="tf-navbar-user" data-navbar-user></div>
</nav>
<main class="tf-page">
  <div>
    <h1 class="tf-h1" data-salutation>Bonjour</h1>
    <p class="tf-meta mt-1 mb-0" data-date></p>
  </div>

  <section class="tf-panel-dark d-flex flex-wrap gap-4 align-items-center tf-hidden" data-trajet-en-cours>
    <div class="d-flex flex-column gap-3" style="flex:1 1 320px">
      <div class="d-flex align-items-center gap-3 flex-wrap">
        <span class="tf-pill live" style="background:rgba(217,112,47,.2);color:#F0A878">Trajet en cours</span>
        <span class="tf-mono tf-meta" data-meta></span>
      </div>
      <h2 style="font-size:30px;font-weight:500;letter-spacing:-.025em;margin:0" data-titre></h2>
      <div>
        <div class="tf-progress"><span data-progression style="width:0"></span></div>
        <div class="d-flex justify-content-between tf-mono mt-2" style="font-size:11.5px;color:var(--tf-on-dark-muted)">
          <span data-ecoule></span><span data-prevue></span>
        </div>
      </div>
    </div>
    <div class="d-flex flex-column gap-3" style="width:230px">
      <a class="tf-btn tf-btn-on-dark" data-lien-suivi href="trajet-en-cours.html">+ Ajouter un arret</a>
      <a class="tf-btn tf-btn-outline-dark" data-lien-incident href="incident-nouveau.html">Signaler un incident</a>
      <button class="tf-btn tf-btn-primary" type="button" data-terminer>Terminer le trajet</button>
    </div>
  </section>

  <section class="tf-card tf-card-pad d-flex flex-wrap align-items-center gap-4 tf-hidden" data-aucun-trajet>
    <div>
      <h2 class="tf-h2">Aucun trajet en cours</h2>
      <p class="tf-meta mt-1 mb-0">Creez un trajet pour commencer a enregistrer vos arrets.</p>
    </div>
    <a class="tf-btn tf-btn-primary ms-auto" href="trajet-nouveau.html">+ Nouveau trajet</a>
  </section>

  <div class="d-flex align-items-center justify-content-between mt-2">
    <h2 class="tf-h2">Trajets passes</h2>
    <a class="tf-btn tf-btn-ghost" href="trajet-nouveau.html">+ Nouveau trajet</a>
  </div>
  <div class="row g-3" data-passes></div>
</main>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/format.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/gps.js"></script>
<script src="../assets/js/chauffeur.js"></script>
</body>
</html>
