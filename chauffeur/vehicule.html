<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Jonathan K-N">
<title>Mon vehicule · TransitFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/transitflow.css" rel="stylesheet">
</head>
<body data-page="vehicule">
<nav class="tf-navbar">
  <a class="tf-brand" href="#">Transit<span>Flow</span></a>
  <div class="tf-navbar-user" data-navbar-user></div>
</nav>
<main class="tf-page">
  <div><h1 class="tf-h1">Mon vehicule</h1><p class="tf-meta mt-1 mb-0" data-source></p></div>
  <section class="tf-card tf-card-pad tf-hidden" data-aucun>
    <p class="mb-0">Aucun vehicule ne vous est attribue pour le moment. Votre vehicule apparait ici des que vous
      demarrez un trajet, ou si votre administrateur vous en attribue un habituellement.</p>
  </section>
  <section class="tf-card tf-card-pad d-flex flex-wrap align-items-center gap-4 tf-hidden" data-vehicule>
    <div class="flex-fill">
      <div class="d-flex align-items-center gap-3 flex-wrap">
        <span class="tf-mono" style="font-size:26px;font-weight:500" data-plaque></span><span data-statut></span></div>
      <div class="tf-meta mt-1" data-modele></div>
    </div>
    <div class="text-end"><div class="tf-mono" style="font-size:24px;font-weight:500" data-compteur></div>
      <div class="tf-meta">compteur</div></div>
  </section>
  <section class="tf-card tf-hidden" data-bloc-entretiens>
    <div class="tf-card-pad pb-0"><h2 class="tf-h3">Prochains entretiens</h2></div>
    <ul class="tf-liste" data-entretiens></ul>
  </section>
  <section class="tf-card tf-hidden" data-bloc-interventions>
    <div class="tf-card-pad pb-0"><h2 class="tf-h3">Interventions prevues ou en cours</h2></div>
    <ul class="tf-liste" data-interventions></ul>
  </section>
</main>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/format.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/paie.js"></script>
<script src="../assets/js/chauffeur.js"></script>
<script src="../assets/js/chauffeur-portail.js"></script>
</body>
</html>
