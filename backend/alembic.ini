; TransitFlow — configuration Alembic (migrations de la base de donnees)
; Auteur : Jonathan K-N
;
; Usage (depuis la racine du projet) :
;   alembic -c backend/alembic.ini revision --autogenerate -m "description"
;   alembic -c backend/alembic.ini upgrade head
;
; L adresse de la base de donnees n est PAS ici : elle vient de
; backend/settings.py (donc de la variable d environnement TF_DATABASE_URL),
; voir backend/alembic/env.py.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
